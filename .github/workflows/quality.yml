name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: zip

      - name: Run fast repository checks
        run: make check

      - name: Validate Compose configuration
        run: make compose-config

      - name: Verify reproducible release artifacts
        run: make verify-build

      - name: Build release artifacts
        run: make build

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: jouvence-para-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
