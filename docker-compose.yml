services:
  database:
    image: mysql:8.0
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${JP_DB_NAME:-wordpress}
      MYSQL_USER: ${JP_DB_USER:-wordpress}
      MYSQL_PASSWORD: ${JP_DB_PASSWORD:-wordpress_dev_password}
      MYSQL_ROOT_PASSWORD: ${JP_DB_ROOT_PASSWORD:-root_dev_password}
    volumes:
      - database_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${JP_DB_ROOT_PASSWORD:-root_dev_password}"]
      interval: 10s
      timeout: 5s
      retries: 10

  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "${JP_HTTP_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: database:3306
      WORDPRESS_DB_NAME: ${JP_DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${JP_DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${JP_DB_PASSWORD:-wordpress_dev_password}
      WORDPRESS_DEBUG: ${JP_WP_DEBUG:-1}
    volumes:
      - wordpress_data:/var/www/html
      - ./wordpress/wp-content/themes/jouvence-para:/var/www/html/wp-content/themes/jouvence-para
      - ./wordpress/wp-content/plugins/jouvence-para-core:/var/www/html/wp-content/plugins/jouvence-para-core

  wpcli:
    image: wordpress:cli-php8.3
    user: "33:33"
    depends_on:
      database:
        condition: service_healthy
      wordpress:
        condition: service_started
    environment:
      WORDPRESS_DB_HOST: database:3306
      WORDPRESS_DB_NAME: ${JP_DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${JP_DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${JP_DB_PASSWORD:-wordpress_dev_password}
    volumes:
      - wordpress_data:/var/www/html
      - ./wordpress/wp-content/themes/jouvence-para:/var/www/html/wp-content/themes/jouvence-para
      - ./wordpress/wp-content/plugins/jouvence-para-core:/var/www/html/wp-content/plugins/jouvence-para-core

volumes:
  database_data:
  wordpress_data:
